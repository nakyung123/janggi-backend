# 푸시할 때마다 깨끗한 리눅스에서 다시 확인하고, main 이면 올린다.
#
# 테스트만 돌리지 않고 **컨테이너까지 띄워 본다.** 2026-10-10 에 jar 로는 멀쩡한데
# 컨테이너가 시작조차 못 한 일이 있었다(없는 로그 형식 이름). 이미지로 돌려야만
# 드러나는 종류가 있다.
#
# **확인과 배포를 한 일감에 둔 까닭** - 올리는 것이 위에서 띄워 보고 찔러 본 그
# 이미지여야 한다. 일감을 나누면 330MB 를 주고받아야 하고, 다시 지으면 **시험한
# 바이트와 나간 바이트가 달라진다.** 같은 소스라도 그렇다.

name: CI 와 배포

on:
  push:
    branches: [main]
  pull_request:

# 한 번에 하나만 돈다. main 에 빨리 두 번 올리면 **오래된 커밋이 나중에 배포되는** 일이
# 생기고, 그러면 되돌아간 줄도 모르고 되돌아간다. 취소하지 않고 줄을 세운다 - 배포
# 도중에 끊기는 것이 더 나쁘다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # **`ubuntu-latest` 를 쓰지 않는다.** 그 이름은 어느 날 새 우분투를 가리키고, 그러면
    # 내가 아무것도 안 바꾼 아침에 빨간불이 뜬다. 2026-10-19 에 26 으로 옮겨간다고
    # 예고가 떴을 때 못 박았다. 올리는 것은 **올리고 싶을 때** 한다.
    runs-on: ubuntu-24.04

    # `id-token` 이 있어야 GCP 에 열쇠 없이 들어간다. 이것이 빠지면 인증이 아예 안 되는데
    # 오류가 "unable to get credentials" 로 나와서 엉뚱한 데를 보게 된다.
    permissions:
      contents: read
      id-token: write

    steps:
      # Action 은 태그가 아니라 커밋으로 부른다. 태그는 주인이, 또는 그 계정을 턴 사람이
      # 다른 코드로 옮길 수 있다(2025-03 tj-actions/changed-files). 이 일감은 GCP 배포
      # 권한을 받으므로 Action 이 바뀌면 그 권한이 같이 넘어간다. 판을 올릴 때는 해시와
      # 뒤의 판 주석을 같이 바꾼다.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: 테스트와 빌드
        run: ./gradlew --no-daemon clean build

      # "BUILD SUCCESSFUL" 만 보고 넘어가지 않는다. 테스트가 UP-TO-DATE 로 건너뛰었을
      # 수 있어서, 몇 개가 실제로 돌았는지 센다. 0개면 실패로 본다.
      - name: 테스트가 실제로 돌았는지 센다
        run: |
          # bc 가 깔려 있다고 가정하지 않는다. awk 는 어디에나 있다.
          N=$(grep -ho 'tests="[0-9]*"' build/test-results/test/*.xml |
                grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "돌아간 테스트: ${N:-0}개"
          if [ "${N:-0}" -lt 1 ]; then
            echo "::error::테스트가 하나도 돌지 않았습니다."
            exit 1
          fi

      - name: 이미지 만들기
        # 커밋을 이미지 안에 넣는다. 뜰 때 로그에 찍혀서 "지금 실서버가 어느 코드인가" 에
        # 한 번에 답할 수 있다.
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t janggi-events:ci .

      # **DB 를 같이 띄운다.** 1-5 부터 앱이 DB 없이는 못 뜬다 - Flyway 가 시작할 때
      # 마이그레이션을 돌리고, 하이버네이트가 엔티티와 표를 맞춰 본다. 없으면
      # "Failed to determine a suitable driver class" 로 4초 만에 죽는다.
      #
      # 실서버(Neon)를 쓰지 않는다. CI 가 실제 데이터에 손대면 안 되고, 거기 비밀번호를
      # 넣으려면 공개 저장소에 시크릿을 하나 더 둬야 한다. 빈 Postgres 로 충분하다 -
      # 여기서 보려는 것은 **마이그레이션이 진짜 도는가**지 데이터가 아니다.
      - name: DB 를 띄운다
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci postgres:18-alpine

          for i in $(seq 1 30); do
            if docker exec ci-db pg_isready -q -U postgres -d ci 2>/dev/null; then
              echo "DB 준비됨 (${i}초)"; break
            fi
            if [ -z "$(docker ps -q -f name=ci-db)" ]; then
              echo "::error::DB 컨테이너가 죽었습니다."; docker logs ci-db; exit 1
            fi
            sleep 1
          done

      - name: 띄워서 직접 불러 본다
        run: |
          # **로그인 설정값도 줘야 뜬다.** 없으면 Signer 가 생성자에서 막고
          # GOOGLE_CLIENT_ID 자리도 풀리지 않아 컨텍스트가 통째로 안 뜬다 - 깜빡했을 때
          # 열리는 쪽이 아니라 닫히는 쪽으로 만든 것이 여기서도 일한다.
          #
          # **진짜 값이 아니다.** 이 검사는 로그인을 해 보지 않는다 - 주소가 서고 측정이
          # 계속 들어오는지만 본다. 진짜 로그인은 가짜 구글을 세운 LoginFlowTest 가
          # 테스트 단계에서 이미 끝까지 돌려 봤다.
          docker run -d --name ci --network ci-net -p 8080:9090 -e PORT=9090 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://ci-db:5432/ci \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=ci \
            -e JANGGI_TOKEN_SECRET=ci-에서만-쓰는-열쇠-1234567890 \
            -e GOOGLE_CLIENT_ID=ci-클라이언트 \
            -e GOOGLE_CLIENT_SECRET=ci-비밀 \
            janggi-events:ci

          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \
                    http://localhost:8080/actuator/health)" = "200" ]; then
              echo "준비됨 (${i}초)"; break
            fi
            # 기다리기 전에 살아 있는지부터 본다. 죽은 것을 끝까지 기다린 적이 있다.
            # **이름을 정확히 맞춘다.** `-f name=ci` 는 부분 일치라 **ci-db 에도 맞는다.**
            # DB 가 살아 있으니 아래 줄이 영영 안 울렸고, 2026-10-14 에 앱이 죽었는데도
            # 30초를 기다린 뒤 "받음 000" 으로 끝났다. 바로 위에 "죽은 것을 끝까지
            # 기다린 적이 있다" 고 적어 두고 만든 검사가 정작 일하지 않았다.
            if [ -z "$(docker ps -q -f name=^ci$)" ]; then
              echo "::error::컨테이너가 죽었습니다."
              docker logs ci; exit 1
            fi
            sleep 1
          done

          기대() { printf '  %-22s 기대 %s  받음 %s\n' "$1" "$2" "$3"
                   [ "$2" = "$3" ] || { echo "::error::$1 이 다릅니다."; exit 1; }; }

          # 한글이 든 본문은 파일로 만들어 보낸다. 셸을 거치면 글자가 변한다.
          printf '%s' '{"events":[{"name":"app_open","sid":"ci01","browser":"사파리 17","os":"아이폰"}]}' > ok.json
          printf '%s' '{"events":[{"name":"없는이름","sid":"ci02"}]}' > bad.json

          기대 "제대로"      204 "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                 localhost:8080/events -H 'Content-Type: application/json' --data-binary @ok.json)"
          기대 "모르는 이름" 400 "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                 localhost:8080/events -H 'Content-Type: application/json' --data-binary @bad.json)"
          기대 "상태 확인"   200 "$(curl -s -o /dev/null -w '%{http_code}' \
                 localhost:8080/actuator/health)"

          # **DB 에 직접 대고 확인한다.** 204 를 받았다는 것은 "받았다" 까지고,
          # 쌓였는지는 다른 이야기다 - 쌓기에 실패해도 204 를 주도록 만들어 뒀다.
          #
          # 위에서 보낸 것이 딱 한 건이어야 한다. 400 으로 거절한 것까지 들어가면 2가 된다.
          기대 "쌓인 건수"   1 "$(docker exec ci-db psql -qtAX -U postgres -d ci \
                 -c 'select count(*) from event')"
          기대 "쌓인 방문"   ci01 "$(docker exec ci-db psql -qtAX -U postgres -d ci \
                 -c 'select sid from event')"
          # 2026-10-08 에 자동 도구가 한글 세 글자를 날린 일이 있었다. 이제는 HTTP · 잭슨 ·
          # JDBC · Postgres 를 지나는 길이 생겼으니, 그 길 끝에서도 글자가 성한지 본다.
          기대 "한글이 성한지" "사파리 17" "$(docker exec ci-db psql -qtAX -U postgres -d ci \
                 -c 'select browser from event')"
          # **숫자를 박지 않는다.** 저장소의 마이그레이션 파일 수를 세어 쓴다 -
          # 박아 두면 표를 바꿀 때마다 여기가 한 번씩 빨간불이 되고, 그러면
          # "또 그거겠지" 하며 숫자만 고치고 넘어가게 된다. 세어 쓰면 **파일은
          # 늘었는데 안 돌아간 경우**를 잡는 검사가 된다.
          MIGRATIONS=$(ls src/main/resources/db/migration/V*.sql | wc -l | tr -d ' ')
          기대 "적용된 판"   "$MIGRATIONS" "$(docker exec ci-db psql -qtAX -U postgres -d ci \
                 -c 'select count(*) from flyway_schema_history where success')"

          # **토큰을 안 걸고 띄웠으므로 /stats 는 닫혀 있어야 한다.** 설정을 깜빡했을 때
          # 열리는 것이 아니라 닫히는 쪽인지를 여기서 매번 본다. 404 다 - 403 을 주면
          # "여기 뭔가 있다" 를 알려주는 셈이라서.
          기대 "통계는 닫힘"  404 "$(curl -s -o /dev/null -w '%{http_code}' \
                 localhost:8080/stats)"

      # 여기가 핵심이다. 우리 앱이 내보낸 줄은 **전부가 JSON** 이어야 Cloud Logging 이
      # 칸으로 뜯는다. 한 줄이라도 아니면 그 줄은 영영 검색되지 않는다.
      - name: 로그가 칸으로 뜯기는 모양인지
        run: |
          docker logs ci > app.log 2>&1
          python3 - <<'PY'
          import io, json
          줄 = [l for l in io.open("app.log", encoding="utf-8", errors="replace")
                .read().splitlines() if l.strip()]
          글자, 이벤트 = [], 0
          for l in 줄:
              try:
                  d = json.loads(l)
              except ValueError:
                  글자.append(l); continue
              if "evt" in d:
                  이벤트 += 1
          print("줄 %d개 · 이벤트 %d건 · JSON 이 아닌 줄 %d개" % (len(줄), 이벤트, len(글자)))
          for l in 글자[:5]:
              print("  JSON 아님:", l[:120])
          깨짐 = io.open("app.log", encoding="utf-8", errors="replace").read().count("\N{REPLACEMENT CHARACTER}")
          print("깨진 글자:", 깨짐)
          if 글자:   raise SystemExit("::error::JSON 이 아닌 줄이 있습니다.")
          if 깨짐:   raise SystemExit("::error::로그에 깨진 글자가 있습니다.")
          if 이벤트 < 1: raise SystemExit("::error::이벤트가 하나도 안 적혔습니다.")
          PY

      - name: 치우기
        if: always()
        run: |
          docker rm -f ci ci-db || true
          docker network rm ci-net || true

      # 2026-10-08 에 자동 PR 이 한글 세 글자를 날린 일이 있었다. 영어만 있는 파일에서는
      # 안 생겨서 도구들이 못 보고 지나간다. 세 바이트를 printf 로 만들어 그대로 찾는다.
      - name: 깨진 글자 검사
        run: |
          PAT=$(printf '\xef\xbf\xbd')
          if git grep -lF "$PAT" -- . ; then
            echo "::error::위 파일에 깨진 글자가 있습니다."
            exit 1
          fi
          echo "깨끗"

      # ─────────────────────────────────────────────────────────────────────
      # 여기서부터 배포. main 에 푸시했을 때만 돈다.
      #
      # **맨 뒤에 둔 것이 안전장치다.** 위의 깨진 글자 검사가 마지막 검사인데, 배포를
      # 그 앞에 두면 깨진 소스가 그대로 올라간다. 순서가 곧 규칙이다.
      #
      # 끌어온 PR 에서는 돌지 않는다 - `pull_request` 는 이름이 달라 조건에 걸린다.
      # 신원 쪽에도 "이 저장소에서 온 것만" 조건이 걸려 있어 막는 곳이 둘이다.
      # ─────────────────────────────────────────────────────────────────────

      - name: GCP 에 들어가기 (열쇠 파일 없이)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: janggi-events
          workload_identity_provider: projects/982664928901/locations/global/workloadIdentityPools/github/providers/janggi-events
          service_account: github-deploy@janggi-events.iam.gserviceaccount.com

      - name: gcloud 준비
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: 시험한 그 이미지를 올린다
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REPO=asia-northeast1-docker.pkg.dev/janggi-events/cloud-run-source-deploy/janggi-events
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

          docker tag janggi-events:ci "$REPO:$GITHUB_SHA"
          docker push "$REPO:$GITHUB_SHA"

          # **태그가 아니라 digest 로 배포한다.** 태그는 나중에 다른 이미지를 가리킬 수
          # 있어서, 리비전이 무엇으로 돌고 있는지 나중에 알 수 없게 된다.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REPO:$GITHUB_SHA")
          echo "올릴 것: $DIGEST"
          echo "IMAGE=$DIGEST" >> "$GITHUB_ENV"

      - name: Cloud Run 에 올린다
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 설정값을 매번 적어 넣는다. 적지 않으면 서비스에 남은 값이 쓰이는데, 그러면
          # **어디에 무엇이 걸려 있는지 아무 데도 안 적혀 있는** 상태가 된다.
          #
          # `--allow-unauthenticated` 는 일부러 뺐다. 그것은 "누가 부를 수 있나" 를
          # 바꾸는 일(setIamPolicy)이고, 배포 계정에는 그 권한이 없다. 서비스에 이미
          # 걸려 있어서 리비전이 바뀌어도 그대로다.
          gcloud run deploy janggi-events \
            --image="$IMAGE" \
            --region=asia-northeast1 \
            --max-instances=2 \
            --min-instances=0 \
            --timeout=30s \
            --memory=512Mi \
            --cpu=1 \
            --quiet

      - name: 올라간 것을 실제로 찔러 본다
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          U=https://janggi-events-982664928901.asia-northeast1.run.app

          기대() { printf '  %-22s 기대 %s  받음 %s\n' "$1" "$2" "$3"
                   [ "$2" = "$3" ] || { echo "::error::$1 이 다릅니다."; exit 1; }; }

          기대 "상태 확인" 200 "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                 "$U/actuator/health")"

          # **env 를 dev 로 박는다.** 이걸 빼면 배포마다 한 건씩 실제 통계에 섞인다.
          # sid 에 커밋을 넣어 두면 나중에 "이건 배포 확인이었다" 를 알아볼 수 있다.
          printf '%s' "{\"events\":[{\"name\":\"app_open\",\"sid\":\"cd${GITHUB_SHA:0:6}\",\"browser\":\"배포확인\",\"env\":\"dev\"}]}" > cd.json
          기대 "이벤트 받기" 204 "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                 -X POST "$U/events" -H 'Content-Type: application/json' --data-binary @cd.json)"
