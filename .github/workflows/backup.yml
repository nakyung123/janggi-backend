# 매일 한 번 DB 를 받아서 Cloud Storage 에 둔다. **파일이 둘이다.**
#
# | 파일 | 내용 | 보관 |
# | --- | --- | --- |
# | `event-…dump` | 측정 기록 | 365일 |
# | `user-…dump` | 계정(`app_user`)과 기보(`game`) | **30일** |
#
# **왜 나누나** - `user-` 쪽에는 `google_sub` 와 둔 판이 들어 있다. 탈퇴하면 30일 뒤
# 진짜로 지우는데, 백업을 1년 들고 있으면 **지웠다면서 1년을 들고 있는 것**이 된다.
# 보관 기간은 버킷의 수명 규칙이 앞글자(`event-`/`user-`)로 갈라서 준다.
#
# **왜 계정과 기보도 받나** - 한동안 측정만 받았다. "기보는 기기에 원본이 있어서 다시
# 올라온다" 고 보았는데 **틀렸다.** 올릴 것을 고르는 조건이 localStorage 의 `uploaded`
# 를 보기 때문에(`useServerGames.ts`), 서버가 잃어버려도 기기는 "이미 올렸다" 고 기억해
# 다시 올리지 않는다. 서버 목록은 화면에 표시할 때만 쓴다.
#
# **왜 02:23 인가** - GitHub 예약 실행은 부하가 높은 시간에 늦거나 아예 안 돈다.
# 정각은 모두가 적는 시각이라 피한다.
#
# **안 도는 경우는 못 잡는다.** 실패하면 GitHub 이 메일을 보내지만, 아예 안 돌면
# 실패도 안 해서 조용하다. 아는 구멍이다.

name: DB 백업

on:
  schedule:
    - cron: "23 17 * * *" # UTC. 한국 시각 02:23
  workflow_dispatch: # 마이그레이션 올리기 전에 손으로 돌린다

permissions:
  contents: read
  id-token: write # GCP 에 열쇠 파일 없이 들어가려면 필요하다

jobs:
  # 일감 키는 영문·숫자·_·- 만 된다. 한글을 쓰면 작업이 아예 안 뜬다
  # (HTTP 422: The identifier is invalid). 한글은 위의 name: 에만 쓴다.
  backup:
    # **`ubuntu-latest` 를 쓰지 않는다.** ci.yml 과 같은 까닭이다 - 그 이름은 어느 날
    # 새 우분투를 가리키고, 그러면 아무것도 안 바꾼 아침에 빨간불이 뜬다.
    # 2026-10-19 에 26 으로 옮겨간다는 예고가 떠 있다.
    runs-on: ubuntu-24.04
    steps:
      # pg_dump 는 **자기보다 높은 판의 서버를 못 받는다.** Neon 이 18.6 이라
      # postgres:18 로 고정한다. Neon 이 19 로 올라가면 여기서 깨지는데, 깨지면
      # 이 일감이 실패해서 메일이 오므로 조용히 썩지는 않는다.
      - name: 두 파일을 받는다
        env:
          DB: ${{ secrets.BACKUP_DB_URL }}
        run: |
          set -euo pipefail

          # **두 파일이 같은 시각을 쓴다.** 따로 찍으면 자정을 넘길 때 날짜가 갈려서
          # 짝이 안 맞는 것처럼 보인다.
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          EVENT_NAME="event-$STAMP.dump"
          USER_NAME="user-$STAMP.dump"
          echo "EVENT_NAME=$EVENT_NAME" >> "$GITHUB_ENV"
          echo "USER_NAME=$USER_NAME" >> "$GITHUB_ENV"

          # 주소를 인자로 주면 ps 에 보인다. 환경 변수로 넘긴다.
          docker run --rm -e DB -v "$PWD:/out" postgres:18 \
            sh -c 'pg_dump "$DB" --table=event --format=custom --no-owner --no-acl --file=/out/'"$EVENT_NAME"

          # **둘을 한 파일에 담는다.** game 이 app_user 를 외래 키로 가리켜서, 따로
          # 받으면 되살릴 때 가리킬 줄이 없다.
          docker run --rm -e DB -v "$PWD:/out" postgres:18 \
            sh -c 'pg_dump "$DB" --table=app_user --table=game --format=custom --no-owner --no-acl --file=/out/'"$USER_NAME"

          ls -l "$EVENT_NAME" "$USER_NAME"

      # **파일이 생겼다고 백업이 된 것은 아니다.** 0바이트거나 중간에 끊긴 파일도
      # 생긴다. 목록을 읽어 내용이 들어 있는지 본다.
      - name: 받은 파일들이 멀쩡한지 본다
        run: |
          set -euo pipefail

          # 첫 인자가 파일 이름이고 나머지는 목록에 있어야 하는 줄이다.
          # 변수 이름을 한글로 두지 않는다 - bash 는 ASCII 만 받는다.
          check() {
            f="$1"
            shift
            [ -s "$f" ] || { echo "$f 가 비었다"; exit 1; }

            docker run --rm -v "$PWD:/in" postgres:18 pg_restore --list "/in/$f" > list.txt
            echo "--- $f ---"
            cat list.txt

            for want in "$@"; do
              grep -q "$want" list.txt || { echo "$f 에 '$want' 이(가) 없다"; exit 1; }
            done
          }

          # 표·자료·순서의 현재 값이 다 있어야 한다. 순서 값이 빠지면 되살린 뒤
          # 자동 번호가 1부터 시작해 기존 줄과 부딪힌다.
          check "$EVENT_NAME" \
            "TABLE public event" \
            "TABLE DATA public event" \
            "SEQUENCE SET public event_id_seq"

          check "$USER_NAME" \
            "TABLE public app_user" \
            "TABLE public game" \
            "TABLE DATA public app_user" \
            "TABLE DATA public game" \
            "SEQUENCE SET public app_user_id_seq" \
            "SEQUENCE SET public game_id_seq"

      # `token_format: access_token` 으로 토큰을 바로 받는다. 이러면 gcloud 를 따로
      # 깔 필요가 없다 - 아래 올리는 단계가 REST 라 gcloud 를 아예 안 쓴다.
      - name: GCP 에 들어가기 (열쇠 파일 없이)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: janggi-events
          workload_identity_provider: projects/982664928901/locations/global/workloadIdentityPools/github/providers/janggi-events
          service_account: janggi-backup@janggi-events.iam.gserviceaccount.com
          token_format: access_token

      # **`gcloud storage cp` 를 못 쓴다.** 올리기 전에 목적지를 먼저 읽어 보는데
      # (storage.objects.get) 이 계정에는 읽기 권한이 없다. 권한을 느슨하게 하는 대신
      # REST 로 올린다. 이 계정은 새 파일을 더할 수만 있고 읽지도 지우지도 못한다.
      - name: 버킷에 올린다
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          # **크기 비교를 파일로 빼 둔다.** 함수 안에 heredoc 을 넣으면 끝 표시(PY)가
          # 줄 맨 앞에 와야 하는데 들여쓰기 때문에 안 닫힌다.
          cat > size.py <<'PY'
          import json, os, sys
          d = json.load(open("up.json"))
          here = os.path.getsize(os.environ["NAME"])
          there = int(d["size"])
          print("올린 것 %d 바이트 / 버킷에 %d 바이트" % (here, there))
          if here != there:
              sys.exit("크기가 다르다")
          PY

          send() {
            f="$1"
            url="https://storage.googleapis.com/upload/storage/v1/b/janggi-events-backup/o?uploadType=media&name=$f"

            curl -sS -f -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$url" -o up.json

            cat up.json
            # 올라간 크기가 내 파일과 같은지 본다. 다르면 중간에 끊긴 것이다.
            NAME="$f" python3 size.py
          }

          send "$EVENT_NAME"
          send "$USER_NAME"
