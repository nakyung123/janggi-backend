# Cloud Run 에서만 켜는 설정. 이미지 안에 SPRING_PROFILES_ACTIVE=cloud 가 박혀 있어서
# 컨테이너로 돌리면 자동으로 적용되고, 로컬에서 jar 를 직접 돌리면 적용되지 않는다.
#
# 여기에 클래스 이름을 적는다. 부트가 기본으로 주는 형식은 ecs·gelf·logstash 뿐이고
# 구글 것은 없다 - 'gcp' 라고 적었다가 시작조차 못 하고 죽었다. 자세한 까닭은
# GcpStructuredLogFormatter 의 주석에 있다.
logging.structured.format.console=com.nakyung.janggi.events.common.logging.GcpStructuredLogFormatter
