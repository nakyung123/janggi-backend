spring.application.name=janggi-server

# Cloud Run 은 포트를 PORT 로 알려 준다. 이 값을 안 따르면 컨테이너가 떠도 Cloud Run 이
# "응답이 없다" 고 판단해 배포가 실패한다. 로컬에서는 8080 을 쓴다.
server.port=${PORT:8080}

# 정상 종료. Cloud Run 은 줄일 때 SIGTERM 을 보내는데, 이 설정이 없으면 처리 중인 요청을
# 그 자리에서 끊는다. 기록을 보내는 중이었으면 그 건이 사라진다.
#
# 8초는 Cloud Run 이 주는 시간에 맞춘 값이다. SIGTERM 뒤 10초가 지나면 SIGKILL 이 와서
# 못 막는다. 처음에 20초로 적었는데, 그건 플랫폼이 지켜 줄 수 없는 약속이었다 - 기다리는
# 중에 그냥 죽는다. 나머지 2초는 스프링이 뒷정리할 몫으로 남긴다.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s

# 바깥에 열어 두는 것은 상태 확인 하나뿐이다. 공개 주소라서 늘릴 때마다 무엇이 새는지
# 따져야 한다 - env 나 configprops 는 설정값을 그대로 보여 준다.
management.endpoints.web.exposure.include=health

# 문지기. RequestSizeFilter 와 RateLimitFilter 가 쓴다. Cloud Run 에서는 환경 변수
# (JANGGI_GUARD_LIMIT_PER_MINUTE) 로 배포 없이 바꿀 수 있다.
janggi.guard.limit-per-minute=120
janggi.guard.max-body-bytes=65536

# /stats 를 여는 토큰. **여기에 값을 적지 않는다.** 비어 있으면 그 주소는 아무에게도
# 안 열린다(404). 실제 값은 JANGGI_STATS_TOKEN 환경 변수로 준다 - 로컬은 .env,
# Cloud Run 은 Secret Manager 다.
janggi.stats.token=

# 쿠키에 서명하는 열쇠. **여기에 값을 적지 않는다.** 비어 있으면 서버가 뜨지 않는다
# (Signer 생성자에서 막는다) - 깜빡했을 때 "서명 없이 그냥 통과" 가 되면 울타리가 있는
# 척만 하게 된다. 실제 값은 JANGGI_TOKEN_SECRET 환경 변수로 준다.
janggi.token.secret=

# ── 데이터베이스 (Neon Postgres, 싱가포르) ──────────────────────────────────
#
# 접속 정보는 여기 없다. SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 환경 변수로
# 들어온다 - 로컬은 .env(.gitignore 에 있다), Cloud Run 은 서비스 환경 변수다.

# **뜰 때 DB 에 연결하지 않는다.** 기본값은 1ms 인데, 그러면 연결을 못 얻을 때 예외를
# 던져서 앱이 아예 안 뜬다. 음수면 시도 자체를 건너뛰고 처음 쓸 때 연결한다.
#
# 이걸 안 하면 이렇게 된다 - Neon 이 잠깐 맛이 가면 우리 서버가 못 뜨고, Cloud Run 이
# 죽은 컨테이너로 보고 다시 띄우고, 그 재시작이 또 콜드 스타트 요금이다. 게다가 DB 가
# 없어도 기록은 로그에 남으므로 **잃는 것이 없다.** "서버가 떴나"와 "DB 가 떴나"를
# 한 줄로 묶지 않는다.
spring.datasource.hikari.initialization-fail-timeout=-1

# 연결을 많아야 둘만 쥔다. 기본은 10인데, 하루 수십 건 받는 서버가 열 개를 붙들고 있을
# 까닭이 없다. 서버가 최대 2대라 다 합쳐도 4개고, Neon 무료 한도는 100개 남짓이다.
spring.datasource.hikari.maximum-pool-size=2

# **쉴 때 연결을 놓는다.** Neon 무료는 5분 쉬면 잠드는데, 그게 공짜의 조건이다
# (한 달 컴퓨트 100시간). 안 쓰는 연결을 붙들고 있다가 잠드는 것을 방해하면 쓰지도
# 않으면서 시간이 닳는다. minimum-idle 이 0이라야 idle-timeout 이 실제로 일한다.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000

# **엔티티와 Flyway 가 만든 표가 어긋나면 시작할 때 걸린다.** 표를 만드는 것은 Flyway
# 뿐이고 하이버네이트는 맞는지 보기만 한다. 어긋난 채로 뜨면 넣다가 터지는데, 그때는
# 이미 그 요청의 기록이 버려진 뒤다.
spring.jpa.hibernate.ddl-auto=validate

# 요청이 끝날 때까지 연결을 쥐고 있지 않는다. 기본값이 켜짐이라 꺼 둬야 한다 -
# 연결이 2개뿐인데 응답을 쓰는 동안까지 쥐고 있으면 그 둘이 금방 동난다.
spring.jpa.open-in-view=false
