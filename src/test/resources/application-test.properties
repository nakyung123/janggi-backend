# 테스트에서만 얹는 설정. `test` 프로파일은 build.gradle 이 모든 테스트에 켜 준다.
#
# **왜 application.properties 가 아니라 프로파일인가** - 테스트 쪽에 같은 이름으로 두면
# 본체 설정을 **통째로 가린다.** 클래스패스에서 테스트 쪽이 이기기 때문이다. 실제로
# 그렇게 뒀다가 요청 제한 숫자(janggi.guard.limit-per-minute)까지 같이 사라져서
# "limitPerMinute 는 1 이상이어야 합니다: 0" 으로 터졌다. 프로파일은 가리지 않고 얹힌다.
#
# **접속 주소를 안 적는 까닭** - 적지 않으면 부트가 클래스패스의 H2 를 보고 메모리 DB 를
# 알아서 만든다. 적어 두면 EventRepositoryTest 가 진짜 Postgres 를 붙일 때 그것과 싸운다.

# DB 를 안 쓰는 테스트는 표가 필요 없다. 하이버네이트가 엔티티대로 만들고 버린다.
# 진짜 마이그레이션은 EventRepositoryTest 가 Postgres 에서 돌려 본다 - H2 로는
# TIMESTAMPTZ · JSONB · ON CONFLICT 중 하나도 확인되지 않는다.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# 서명 열쇠. Signer 가 @Component 라 모든 테스트가 이것을 필요로 한다 - 없으면 컨텍스트가
# 통째로 안 뜬다. **진짜 열쇠가 아니다.** 테스트는 서명이 맞고 틀리는 것만 보면 되고,
# 실제 값은 .env 와 Secret Manager 에만 있다.
janggi.token.secret=테스트에서만-쓰는-열쇠-1234567890

# 구글 등록. **진짜 값이 아니다.** 본체 설정은 ${GOOGLE_CLIENT_ID} 를 쓰는데 CI 에는 그
# 환경 변수가 없고, 프로파일 설정이 이기므로 그 자리는 읽히지도 않는다. 값이 있어야
# 하는 까닭은 스프링이 등록 하나를 다 채워야 oauth2Login 을 세울 수 있기 때문이다 -
# 비어 있으면 컨텍스트가 통째로 안 뜬다.
spring.security.oauth2.client.registration.google.client-id=테스트-클라이언트
spring.security.oauth2.client.registration.google.client-secret=테스트-비밀
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost/login/oauth2/code/google
